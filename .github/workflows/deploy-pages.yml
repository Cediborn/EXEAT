name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r src public dist/
          # Runtime API base: filled from the API_BASE_URL repository variable.
          # TEMPORARY DEMO WIRING (remove for a real deployment): the hosted
          # frontend points at the developer's local API so the development
          # dashboard bypass can be demonstrated from GitHub Pages. Visitors on
          # other machines simply see the "backend not connected" banner.
          # devBypassAuth is true here only because the configured API is the
          # local development server; the server itself hard-disables the
          # bypass whenever NODE_ENV=production. Set this back to false when
          # API_BASE_URL is pointed at a real hosted API.
          printf "window.ENTRYOUT_CONFIG = { apiBase: '%s', appName: 'Entryout', devBypassAuth: true };\n" \
            "${{ vars.API_BASE_URL }}" > dist/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
