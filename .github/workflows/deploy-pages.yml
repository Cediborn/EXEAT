name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r src public dist/

      # Hosted demonstration by default: demoMode routes every API call to the
      # in-browser demo adapter (src/js/demo/api.js) backed by localStorage — no
      # backend, no external auth. To use a real API instead, set repository
      # variables ENTRYOUT_API_BASE and ENTRYOUT_DEMO_MODE=false.
      - name: Write runtime config
        env:
          ENTRYOUT_API_BASE: ${{ vars.ENTRYOUT_API_BASE }}
          ENTRYOUT_DEMO_MODE: ${{ vars.ENTRYOUT_DEMO_MODE || 'true' }}
        run: node scripts/write-config.mjs dist/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
